name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # The suite is offline by construction: conftest blocks every socket
      # unless a test carries @pytest.mark.live, and no API key is set here.
      - name: Tests
        run: uv run pytest -q

      # Dogfood: doceval lints its own README. `lint` needs no API key and no
      # network, so this runs on every push.
      - name: Dogfood
        run: uv run doceval lint README.md
