[project]
name = "doceval"
version = "0.1.0"
description = "Score written content on house style, editorial quality, and audience fit"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
doceval = "doceval.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doceval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: test makes real network requests; requires DOCEVAL_LIVE_API=1 to run",
]
