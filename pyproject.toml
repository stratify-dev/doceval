[project]
name = "doceval"
version = "0.1.0"
description = "Score written content on house style, editorial quality, and audience fit"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
doceval = "doceval.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doceval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: test makes real network requests; requires DOCEVAL_LIVE_API=1 to run",
]

[project.urls]
Homepage = "https://github.com/stratify-dev/doceval"
Repository = "https://github.com/stratify-dev/doceval"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures are built inline and read better on one line than wrapped.
"tests/*" = ["E501"]
